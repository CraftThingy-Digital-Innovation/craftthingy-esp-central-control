; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[common]
framework = arduino
monitor_speed = 115200
lib_extra_dirs = 
	../craftthingy-esp-core-ota/lib
	./lib
build_flags = 
	-I ../craftthingy-esp-core-ota/include
	-I ../craftthingy-esp-core-ota/lib/CraftThingyCore/src
	-I include
	-D CORE_DEBUG_LEVEL=0
	-D CRAFT_CONTROLLER_ROLE=\"central_control\"
	-D CRAFT_DEFAULT_ROLE=\"central_control\"
	-D CRAFT_DEFAULT_CONTROLLER_REPO=\"craftthingy-esp-central-control\"
	-D APP_VERSION=\"1.1.1\"

[env:esp32dev]
platform = espressif32 @ 6.6.0
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_extra_dirs = ${common.lib_extra_dirs}
board_build.partitions = min_spiffs.csv
build_flags = 
	${common.build_flags}
	-D BOARD_TYPE=\"esp32\"
	-D ASSET_TAG=\"esp32\"
	-Os
lib_deps = 
	SPI
	FS
	SD
	Wire

[env:esp32s3]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_extra_dirs = ${common.lib_extra_dirs}
board_build.partitions = default_8MB.csv
build_flags = 
	${common.build_flags}
	-D BOARD_TYPE=\"esp32s3\"
	-D ASSET_TAG=\"esp32s3\"
	-Os
lib_deps = 
	SPI
	FS
	SD
	Wire
