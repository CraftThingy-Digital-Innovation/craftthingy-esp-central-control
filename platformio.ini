; =================================================================
; CraftThingy Digital Innovation - Central Control & Energy Arbiter
; Primary Target: ESP32 (38-Pin DevKit / NodeMCU-32S / ESP32-WROOM-32)
; =================================================================

[platformio]
default_envs = esp32dev
packages_dir = D:\.platformio\packages
cache_dir = D:\.platformio\.cache
src_dir = src
include_dir = include

[common]
framework = arduino
monitor_speed = 115200
lib_extra_dirs = 
    ../craftthingy-esp-core-ota/lib
    ./lib
build_flags =
    -I ../craftthingy-esp-core-ota/include
    -I ../craftthingy-esp-core-ota/lib/CraftThingyCore/src
    -I include
    -D CORE_DEBUG_LEVEL=0
    -D CRAFT_CONTROLLER_ROLE=\"central_control\"
    -D CRAFT_DEFAULT_ROLE=\"central_control\"
    -D CRAFT_DEFAULT_CONTROLLER_REPO=\"craftthingy-esp-central-control\"
    -D APP_VERSION=\"1.0.0\"

; -----------------------------------------------------------------
; ESP32 Standard (ESP32 38-Pin DevKit, ESP-WROOM-32, Dual-Core)
; -----------------------------------------------------------------
[env:esp32dev]
platform = espressif32 @ 6.6.0
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_extra_dirs = ${common.lib_extra_dirs}
board_build.partitions = min_spiffs.csv
build_flags =
    ${common.build_flags}
    -D BOARD_TYPE=\"esp32\"
    -D ASSET_TAG=\"esp32\"
    -Os
lib_deps =
    SPI
    FS
    SD
    Wire

; -----------------------------------------------------------------
; ESP32-S3 (Dual-Core, 8MB Flash)
; -----------------------------------------------------------------
[env:esp32s3]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_extra_dirs = ${common.lib_extra_dirs}
board_build.partitions = default_8MB.csv
build_flags =
    ${common.build_flags}
    -D BOARD_TYPE=\"esp32s3\"
    -D ASSET_TAG=\"esp32s3\"
    -Os
lib_deps =
    SPI
    FS
    SD
    Wire
